[package]
name = "shoin"
version = "0.2.3"
edition = "2021"
# 1.88 because `ratatui` 0.30 requires it. This was 1.82 — a number from before
# the dependency bumped — and nothing checked it; the CI `msrv` job reads this
# field now, so the claim and the build cannot drift apart again.
rust-version = "1.88"
description = "A no-clutter terminal Markdown editor with modal editing"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/nol00p/Shoin"
homepage = "https://github.com/nol00p/Shoin"
keywords = ["markdown", "editor", "tui", "vim", "notes"]
categories = ["text-editors", "command-line-utilities"]
# What `cargo publish` uploads. The `shoin/*.conf` files are not optional:
# `config/init.rs` compiles them in with `include_str!`. The docs GIFs and
# `examples/` stay on GitHub, where the README's relative links resolve.
include = ["/src/**/*.rs", "/shoin/*.conf", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[[bin]]
name = "shoin"
path = "src/main.rs"

[dependencies]
# TUI. crossterm is used via `ratatui::crossterm` re-export, never as a
# separate dependency — two crossterm versions would fight over the terminal.
ratatui = "0.30"

# Rope text buffer
ropey = "1.6"

# Config
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
notify = "8.2"

# Text handling
unicode-width = "0.2"

# Self-contained math/typesetting backend. Fonts are embedded so preview and
# export do not depend on a user's system TeX installation.
typst-as-lib = { version = "0.17", default-features = false, features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst = "0.15"
typst-layout = "0.15"
typst-render = "0.15"
typst-svg = "0.15"
typst-utils = "0.15"
mitex = "0.2"

# CLI + errors
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"

# TestBackend, which the frame tests render into, ships with ratatui's default
# features — so there are no dev-dependencies at all.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# What `dist` builds release binaries with (.github/workflows/release.yml).
# It inherits everything above, so the binaries match a local release build.
[profile.dist]
inherits = "release"
